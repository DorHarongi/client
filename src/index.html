<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Emperium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="//cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <script>
    try {
      var u = JSON.parse(sessionStorage.getItem('user_info') || '{}');
      if (u.theme && u.theme !== 'default') document.body.setAttribute('data-theme', u.theme);
    } catch(e) {}
  </script>
  <app-root></app-root>
</body>
</html>
