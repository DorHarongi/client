<app-building [building]="buildingInformation">
  <div extraInformation class="academy-content">
    <h4 class="section-title">Skill Tree</h4>

    <div class="skill-points">
      <span>Academy Level: {{ academyLevel }}</span>
      <span>Skill Points: {{ totalPoints }} (Available: {{ availablePoints }})</span>
    </div>

    <div class="skill-grid">
      <div class="skill-row" *ngFor="let row of grid; let rowIndex = index">
        <div
          class="skill-cell"
          *ngFor="let cell of row"
          [ngClass]="getSkillState(cell)"
          (click)="learnSkill(cell)"
        >
          <div class="skill-name">{{ cell.name }}</div>
          <div class="skill-tier">Tier {{ cell.tier }}</div>
          <div class="skill-bonus">
            +{{ cell.bonusPercent }}%
          </div>
        </div>
      </div>
    </div>

    <div class="skill-actions">
      <button class="reset-btn" (click)="resetSkills()" [disabled]="loading">
        {{ loading ? 'Processing...' : 'Reset Skills' }}
      </button>
    </div>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>
</app-building>
