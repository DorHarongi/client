<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emperium</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.4s ease-in;
    }

    .game-frame.loaded {
      opacity: 1;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 50%, #050510 100%);
      color: #e0d6c2;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease-out;
    }

    .splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-inner {
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,100,0.25) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }

    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      filter: drop-shadow(0 0 24px rgba(201,169,100,0.5));
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #c9a964;
      text-shadow: 0 0 20px rgba(201,169,100,0.4), 0 2px 4px rgba(0,0,0,0.6);
      margin-bottom: 18px;
    }

    .status {
      font-size: 1rem;
      color: #a09880;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(201,169,100,0.25);
      border-top-color: #c9a964;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-track {
      width: 240px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin: 0 auto 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c9a964, #e8d5a3);
      border-radius: 2px;
      animation: load 2s ease-in-out forwards;
    }

    @keyframes load {
      to { width: 100%; }
    }

    .fallback-link {
      color: #c9a964;
      text-decoration: none;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(201,169,100,0.3);
      padding-bottom: 2px;
      transition: border-color 0.2s, color 0.2s;
    }

    .fallback-link:hover {
      color: #e8d5a3;
      border-bottom-color: #e8d5a3;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(201,169,100,0.4);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      to   { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>

  <script>
    (function () {
      var container = document.getElementById('particles');
      for (var i = 0; i < 30; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (4 + Math.random() * 6) + 's';
        p.style.animationDelay = (Math.random() * 6) + 's';

        container.appendChild(p);
      }
    })();

    var frame = document.getElementById('gameFrame');
    var splash = document.getElementById('splash');

    function revealGame() {
      frame.classList.add('loaded');
      splash.classList.add('hidden');
    }

    frame.addEventListener('load', function () {
      setTimeout(revealGame, 500);
    });

    setTimeout(revealGame, 5000);
